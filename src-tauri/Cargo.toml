[package]
name = "clamav-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
[lib]
name = "clamav_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
clamav-desktop-core = { path = "core" }
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
pgp = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"

[workspace]
members = ["core"]
default-members = [".", "core"]
resolver = "2"
